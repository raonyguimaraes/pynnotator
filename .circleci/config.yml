version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11

    working_directory: ~/repo

    steps:
      # The repository is public, so clone over HTTPS: the built-in `checkout`
      # needs a GitHub deploy key, and the project no longer has one.
      - run:
          name: Checkout code (HTTPS)
          command: |
            git init -q .
            git remote add origin "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            git fetch -q --depth 1 origin "${CIRCLE_SHA1}"
            git checkout -q FETCH_HEAD
            git log --oneline -1

      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "setup.py" }}
            - v2-dependencies-

      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y bcftools tabix  # libhts comes with these; there is no "htslib" package

      - run:
          name: Install Python dependencies
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -e .[export,dev]

      - save_cache:
          paths:
            - ./venv
          key: v2-dependencies-{{ checksum "setup.py" }}

      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            python -m pytest pynnotator/tests/ -v

      - store_artifacts:
          path: test-reports
          destination: test-reports
